  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; background:#fff; color:#262626; font-size:14px; -webkit-tap-highlight-color:transparent; }
  .wrap { max-width:500px; margin:0 auto; background:#fff; min-height:100vh; }

  .topbar-title { font-size:15px; font-weight:600; }
  .topbar-icon { background:none; border:none; padding:6px; cursor:pointer; color:#262626; }

  .ring.sm { width:24px; height:24px; }

  /* Media attach in displayed comments */
  .attach { margin-top:8px; border-radius:12px; overflow:hidden; position:relative; border:1px solid #efefef; max-width:240px; background:#fafafa; }
  .attach img, .attach video { width:100%; display:block; border-radius:12px; }
  .attach audio { width:100%; display:block; }
  .attach-tag { position:absolute; bottom:6px; left:6px; background:rgba(0,0,0,.65); color:#fff; font-size:10px; font-weight:600; padding:2px 6px; border-radius:4px; }

  /* Custom audio player (voice notes) */
  .audio-player { display:inline-flex; align-items:center; gap:8px; margin-top:8px; padding:6px 12px 6px 6px; background:#efefef; border-radius:20px; max-width:260px; min-width:180px; }

  .composer { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:500px; background:#fff; border-top:1px solid #efefef; z-index:20; padding-bottom:env(safe-area-inset-bottom); }

  .rec-dot { width:10px; height:10px; border-radius:50%; background:#ed4956; animation:blink 1s infinite; flex-shrink:0; }

  .rec-viz { display:flex; align-items:center; gap:2px; height:22px; flex:1; }
  .rec-viz span { width:3px; border-radius:2px; background:#ed4956; min-height:2px; transition:height .08s linear; }
  .rec-time { font-variant-numeric:tabular-nums; font-size:13px; color:#ed4956; min-width:36px; text-align:right; }

  /* Attachment preview row in composer */
  .attach-preview { display:none; padding:10px 16px; border-top:1px solid #efefef; background:#fafafa; align-items:center; gap:10px; }
  .attach-preview.active { display:flex; }

  .modal { background:#fff; border-radius:14px; width:100%; max-width:400px; padding:28px 24px; position:relative; }

  .modal p.sub { font-size:13px; color:#8e8e8e; text-align:center; margin-bottom:20px; }
  .modal input { width:100%; background:#fafafa; border:1px solid #dbdbdb; border-radius:8px; padding:11px 14px; font-size:14px; margin-bottom:10px; outline:none; font-family:inherit; color:#262626; }
  .modal .btn { width:100%; background:#0095f6; color:#fff; border:none; border-radius:8px; padding:11px; font-size:14px; font-weight:600; cursor:pointer; margin-top:6px; font-family:inherit; }
  .modal .btn:disabled { opacity:.5; }
  .modal .switch { text-align:center; font-size:13px; color:#8e8e8e; margin-top:16px; }
  .modal .switch a { color:#0095f6; font-weight:600; cursor:pointer; }
  .modal .error { background:#ffebee; color:#c62828; font-size:12px; padding:8px 12px; border-radius:6px; margin-bottom:10px; display:none; }
  .modal .error.show { display:block; }
  .modal .close { position:absolute; top:8px; right:12px; background:none; border:none; font-size:26px; cursor:pointer; color:#8e8e8e; line-height:1; }

  .toast { position:fixed; bottom:120px; left:50%; transform:translateX(-50%) translateY(20px); background:#262626; color:#fff; padding:10px 18px; border-radius:24px; font-size:13px; opacity:0; transition:all .3s; pointer-events:none; z-index:200; max-width:90vw; text-align:center; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .loading { text-align:center; padding:20px; color:#8e8e8e; font-size:13px; }
  .empty { text-align:center; padding:40px 20px; color:#8e8e8e; font-size:14px; line-height:1.6; }
</style>

<script>
const SUPABASE_URL = 'https://dcvftuzzzdzddgitbfey.supabase.co';
const SUPABASE_KEY = 'sb_publishable_36HzHB6fc_3MTDwTPVrQpQ_noat6EQZ';
const POST_SLUG = 'bvn-fraud-victims';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let currentMode = 'signup';
let pendingAttachment = null;

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2400);
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function timeAgo(iso) {
  const s = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (s < 60) return s + 's';
  if (s < 3600) return Math.floor(s/60) + 'm';
  if (s < 86400) return Math.floor(s/3600) + 'h';
  return Math.floor(s/86400) + 'd';
}

function avatarGradient(id) {
  const grads = ['linear-gradient(135deg,#e84a6a,#8b0020)','linear-gradient(135deg,#6ee7b7,#059669)','linear-gradient(135deg,#d4c453,#6b6320)','linear-gradient(135deg,#93c5fd,#2563eb)','linear-gradient(135deg,#c4b5fd,#7c3aed)','linear-gradient(135deg,#fda4af,#be123c)'];
  let h = 0; for (let i = 0; i < (id||'').length; i++) h = (h*31 + id.charCodeAt(i)) >>> 0;
  return grads[h % grads.length];
}

function initials(name) {
  if (!name) return '?';
  return name.replace(/[^a-zA-Z]/g,'').slice(0,2).toUpperCase() || '?';
}

function fmtDur(s) {
  s = Math.max(0, parseInt(s||0));
  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}

async function loadSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (session && session.user) {
    const { data } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
    currentUser = data || { id: session.user.id, username: session.user.email.split('@')[0], badge: 'member' };
  }
  renderAuthArea();
}

function renderAuthArea() {
  const area = document.getElementById('authArea');
  const composer = document.getElementById('composer');
  if (currentUser) {
    area.innerHTML = '<div style="display:flex;align-items:center;gap:8px">' +
      '<div class="ring" style="width:32px;height:32px"><div class="avatar" style="font-size:11px;background:' + avatarGradient(currentUser.id) + '">' + initials(currentUser.username) + '</div></div>' +
      '<button class="topbar-btn outline" id="logoutBtn" style="font-size:12px;padding:5px 10px">Log out</button></div>';
    document.getElementById('logoutBtn').onclick = async () => { await sb.auth.signOut(); currentUser = null; renderAuthArea(); toast('Logged out'); };
    composer.style.display = 'block';
    const myAv = document.getElementById('myAvatar');
    myAv.textContent = initials(currentUser.username);
    myAv.style.background = avatarGradient(currentUser.id);
  } else {
    area.innerHTML = '<button class="topbar-btn" id="loginBtn">Log in</button>';
    document.getElementById('loginBtn').onclick = () => openModal('login');
    composer.style.display = 'none';
  }
}

function openModal(mode) {
  currentMode = mode;
  document.getElementById('modalTitle').textContent = mode === 'signup' ? 'Sign up' : 'Log in';
  document.getElementById('modalSub').textContent = mode === 'signup' ? "Join the conversation. It's free." : 'Welcome back.';
  document.getElementById('modalSubmit').textContent = mode === 'signup' ? 'Sign up' : 'Log in';
  document.getElementById('mUsername').style.display = mode === 'signup' ? 'block' : 'none';
  document.getElementById('modalSwitch').innerHTML = mode === 'signup' ? 'Already have an account? <a id="switchLink">Log in</a>' : 'No account? <a id="switchLink">Sign up</a>';
  document.getElementById('modalError').classList.remove('show');
  document.getElementById('switchLink').onclick = () => openModal(mode === 'signup' ? 'login' : 'signup');
  document.getElementById('authModal').classList.add('open');
}

document.getElementById('closeModal').onclick = () => document.getElementById('authModal').classList.remove('open');
document.getElementById('authModal').onclick = (e) => { if (e.target.id === 'authModal') e.currentTarget.classList.remove('open'); };

document.getElementById('modalSubmit').onclick = async () => {
  const errEl = document.getElementById('modalError');
  errEl.classList.remove('show');
  const email = document.getElementById('mEmail').value.trim();
  const password = document.getElementById('mPassword').value;
  const username = document.getElementById('mUsername').value.trim();
  if (!email || !password) { errEl.textContent = 'Email and password required'; errEl.classList.add('show'); return; }
  if (password.length < 8) { errEl.textContent = 'Password must be 8+ characters'; errEl.classList.add('show'); return; }
  const btn = document.getElementById('modalSubmit');
  btn.disabled = true; const origText = btn.textContent; btn.textContent = 'Please wait…';
  try {
    if (currentMode === 'signup') {
      if (!username || username.length < 3) throw new Error('Username must be 3+ characters');
      const { data, error } = await sb.auth.signUp({ email, password, options: { data: { username: username, display_name: username } } });
      if (error) throw error;
      if (!data.user) throw new Error('Signup failed');
      await new Promise(r => setTimeout(r, 700));
      const { data: profile } = await sb.from('profiles').select('*').eq('id', data.user.id).single();
      currentUser = profile || { id: data.user.id, username: username, badge: 'member' };
      document.getElementById('authModal').classList.remove('open');
      toast('Welcome, @' + currentUser.username + '!');
      renderAuthArea(); loadComments();
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      const { data: profile } = await sb.from('profiles').select('*').eq('id', data.user.id).single();
      currentUser = profile || { id: data.user.id, username: email.split('@')[0], badge: 'member' };
      document.getElementById('authModal').classList.remove('open');
      toast('Welcome back, @' + currentUser.username + '!');
      renderAuthArea(); loadComments();
    }
  } catch (err) {
    errEl.textContent = err.message || 'Something went wrong';
    errEl.classList.add('show');
  }
  btn.disabled = false; btn.textContent = origText;
};

async function loadComments() {
  const list = document.getElementById('commentsList');
  list.innerHTML = '<div class="loading">Loading comments…</div>';
  const { data: comments, error } = await sb.from('comments').select('*').eq('post_slug', POST_SLUG).eq('is_hidden', false).order('is_pinned', { ascending: false }).order('created_at', { ascending: false }).limit(50);
  if (error) { console.error('Load comments error:', error); list.innerHTML = '<div class="empty">Could not load comments.<br><small>' + escapeHTML(error.message) + '</small></div>'; return; }
  if (!comments || comments.length === 0) { list.innerHTML = '<div class="empty">💬<br>Be the first to comment</div>'; return; }

  const authorIds = [...new Set(comments.map(c => c.author_id))];
  const { data: profiles } = await sb.from('profiles').select('id, username, badge, avatar_url').in('id', authorIds);
  const profileMap = {}; (profiles || []).forEach(p => { profileMap[p.id] = p; });

  let myReactions = new Set();
  if (currentUser) {
    const { data: rxs } = await sb.from('reactions').select('comment_id').eq('user_id', currentUser.id);
    (rxs || []).forEach(r => myReactions.add(r.comment_id));
  }

  const top = comments.filter(c => !c.parent_id);
  const repliesByParent = {};
  comments.filter(c => c.parent_id).forEach(c => { (repliesByParent[c.parent_id] = repliesByParent[c.parent_id] || []).push(c); });

  list.innerHTML = top.map(c => {
    const replies = repliesByParent[c.id] || [];
    const repliesHTML = replies.length ? '<div class="view-replies" data-toggle="' + c.id + '">View ' + replies.length + ' ' + (replies.length === 1 ? 'reply' : 'replies') + '</div>' +
      '<div class="replies" id="replies-' + c.id + '" style="display:none">' + replies.map(r => renderComment(r, profileMap, myReactions, true)).join('') + '</div>' : '';
    return renderComment(c, profileMap, myReactions, false) + repliesHTML;
  }).join('');
  attachCommentHandlers();
}

function renderComment(c, profileMap, myReactions, isReply) {
  const a = profileMap[c.author_id] || { username: 'user_' + c.author_id.slice(0,6), badge: 'member' };
  const av = avatarGradient(c.author_id);
  const badge = a.badge === 'admin' ? '<span class="c-badge admin">Admin</span>' : a.badge === 'vip' ? '<span class="c-badge vip">VIP</span>' : '';
  const liked = myReactions.has(c.id);

  let mediaHTML = '';
  if (c.media_url && c.media_type === 'image') {
    mediaHTML = '<div class="attach"><img src="' + escapeHTML(c.media_url) + '" alt="attached image" loading="lazy"><span class="attach-tag">Photo</span></div>';
  } else if (c.media_url && c.media_type === 'video') {
    mediaHTML = '<div class="attach"><video src="' + escapeHTML(c.media_url) + '" controls playsinline></video></div>';
  } else if (c.media_url && c.media_type === 'audio') {
    const dur = c.media_duration_sec || 0;
    const waveBars = Array.from({length:18}).map(() => '<span style="height:' + (20 + Math.random()*70) + '%"></span>').join('');
    mediaHTML = '<div class="audio-player" data-audio="' + escapeHTML(c.media_url) + '" data-dur="' + dur + '">' +
      '<button class="audio-play" type="button" aria-label="Play voice note"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg></button>' +
      '<div class="audio-wave">' + waveBars + '</div>' +
      '<span class="audio-time">' + fmtDur(dur) + '</span>' +
      '</div>';
  }

  return '<div class="comment" data-comment="' + c.id + '">' +
    '<div class="ring ' + (isReply ? 'sm' : '') + '"><div class="avatar" style="background:' + av + ';' + (isReply ? 'width:100%;height:100%;font-size:10px;' : '') + '">' + initials(a.username) + '</div></div>' +
    '<div class="c-body">' +
      '<span class="c-username">@' + escapeHTML(a.username) + '</span>' + badge +
      '<span class="c-text">' + escapeHTML(c.body) + '</span>' +
      mediaHTML +
      '<div class="c-meta">' +
        '<span>' + timeAgo(c.created_at) + '</span>' +
        '<button class="reply" data-reply="' + c.id + '" data-username="' + escapeHTML(a.username) + '">Reply</button>' +
        '<button data-report="' + c.id + '">Report</button>' +
      '</div>' +
    '</div>' +
    '<div class="like-col">' +
      '<button class="heart ' + (liked ? 'liked' : '') + '" data-like="' + c.id + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></button>' +
      '<span class="like-count">' + (c.reaction_count || 0) + '</span>' +
    '</div>' +
  '</div>';
}

function attachCommentHandlers() {
  document.querySelectorAll('[data-like]').forEach(btn => {
    btn.onclick = async () => {
      if (!currentUser) { openModal('login'); return; }
      const cid = btn.dataset.like;
      const isLiked = btn.classList.contains('liked');
      if (isLiked) {
        await sb.from('reactions').delete().eq('comment_id', cid).eq('user_id', currentUser.id).eq('emoji','❤️');
        btn.classList.remove('liked');
      } else {
        await sb.from('reactions').insert({ comment_id: cid, user_id: currentUser.id, emoji: '❤️' });
        btn.classList.add('liked');
      }
      const { count } = await sb.from('reactions').select('*', { count:'exact', head:true }).eq('comment_id', cid);
      const el = btn.parentElement.querySelector('.like-count');
      if (el) el.textContent = count || 0;
    };
  });

  document.querySelectorAll('[data-reply]').forEach(btn => {
    btn.onclick = () => {
      if (!currentUser) { openModal('login'); return; }
      const input = document.getElementById('commentInput');
      input.value = '@' + btn.dataset.username + ' ';
      input.focus();
      input.dataset.parentId = btn.dataset.reply;
    };
  });

  document.querySelectorAll('[data-report]').forEach(btn => {
    btn.onclick = async () => {
      if (!currentUser) { openModal('login'); return; }
      await sb.from('reports').insert({ comment_id: btn.dataset.report, reporter_id: currentUser.id, reason: 'other', notes: 'Reported from UI' });
      toast('Reported. Thank you.');
    };
  });

  document.querySelectorAll('[data-toggle]').forEach(el => {
    el.onclick = () => {
      const id = el.dataset.toggle;
      const box = document.getElementById('replies-' + id);
      if (!box) return;
      if (box.style.display === 'none') { box.style.display = 'block'; el.textContent = 'Hide replies'; }
      else { box.style.display = 'none'; el.textContent = 'View replies'; }
    };
  });

  document.querySelectorAll('.audio-player').forEach(player => {
    const btn = player.querySelector('.audio-play');
    const timeEl = player.querySelector('.audio-time');
    const bars = player.querySelectorAll('.audio-wave span');
    const src = player.dataset.audio;
    const dur = parseInt(player.dataset.dur || 0);
    let audio = null, playing = false, ticker = null;

    btn.onclick = () => {
      if (!audio) { audio = new Audio(); audio.preload = 'auto'; audio.src = src; }
      if (playing) {
        audio.pause(); playing = false;
        btn.classList.remove('playing');
        btn.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>';
        clearInterval(ticker);
      } else {
        audio.play().catch(e => { console.error('Audio play error:', e); toast('Cannot play audio'); });
        playing = true;
        btn.classList.add('playing');
        btn.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
        ticker = setInterval(() => {
          const d = audio.duration && isFinite(audio.duration) ? audio.duration : dur;
          const p = d ? audio.currentTime / d : 0;
          bars.forEach((b,i) => b.classList.toggle('played', i < Math.floor(p * bars.length)));
          timeEl.textContent = fmtDur(audio.currentTime);
        }, 200);
        audio.onended = () => {
          playing = false; clearInterval(ticker);
          btn.classList.remove('playing');
          btn.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>';
          bars.forEach(b => b.classList.remove('played'));
          timeEl.textContent = fmtDur(dur);
        };
        audio.onerror = () => { console.error('Audio element error:', audio.error); toast('Cannot load audio'); };
      }
    };
  });
}

/* ---------- ATTACHMENT PREVIEW ---------- */
const attachPreview = document.getElementById('attachPreview');
const attachPreviewContent = document.getElementById('attachPreviewContent');
const attachInfo = document.getElementById('attachInfo');

function showAttachPreview() {
  if (!pendingAttachment) { attachPreview.classList.remove('active'); return; }
  attachPreview.classList.add('active');
  if (pendingAttachment.type === 'image') {
    attachPreviewContent.innerHTML = '<img src="' + escapeHTML(pendingAttachment.url) + '" alt="">';
    attachInfo.innerHTML = 'Photo attached<small>Click Post to send</small>';
  } else if (pendingAttachment.type === 'audio') {
    attachPreviewContent.innerHTML = '<audio src="' + escapeHTML(pendingAttachment.url) + '" controls></audio>';
    attachInfo.innerHTML = 'Voice note · ' + fmtDur(pendingAttachment.duration || 0) + '<small>Click Post to send</small>';
  }
}

document.getElementById('attachRemove').onclick = () => {
  pendingAttachment = null;
  attachPreview.classList.remove('active');
  input.value = input.value.replace(/\s*\[(photo|voice note|GIF|image) attached\]/g, '').trim();
  input.dispatchEvent(new Event('input'));
};

/* ---------- COMPOSER ---------- */
const input = document.getElementById('commentInput');
const postBtn = document.getElementById('postBtn');

input.addEventListener('input', () => {
  postBtn.classList.toggle('active', input.value.trim().length > 0 || pendingAttachment);
});

postBtn.onclick = async () => {
  if (!currentUser) { openModal('login'); return; }
  const body = input.value.trim();
  if (!body && !pendingAttachment) return;

  postBtn.disabled = true;
  postBtn.textContent = '…';

  const payload = {
    post_slug: POST_SLUG,
    author_id: currentUser.id,
    body: body || '[media]',
    parent_id: input.dataset.parentId || null
  };

  if (pendingAttachment) {
    payload.media_url = pendingAttachment.url;
    payload.media_type = pendingAttachment.type;
    payload.media_duration_sec = pendingAttachment.duration || null;
  }

  const { error } = await sb.from('comments').insert(payload);
  postBtn.disabled = false;
  postBtn.textContent = 'Post';

  if (error) { console.error('Post comment error:', error); toast('Error: ' + error.message); return; }

  input.value = '';
  input.dataset.parentId = '';
  postBtn.classList.remove('active');
  pendingAttachment = null;
  attachPreview.classList.remove('active');
  toast('Posted ✓');
  loadComments();
};

/* ---------- GALLERY ---------- */
document.getElementById('galleryBtn').onclick = () => {
  if (!currentUser) { openModal('login'); return; }
  document.getElementById('galleryInput').click();
};

document.getElementById('galleryInput').onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { toast('Image too large (5 MB max)'); e.target.value=''; return; }
  toast('Uploading image…');
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const path = currentUser.id + '/' + Date.now() + '.' + ext;
  const { error } = await sb.storage.from('comment-media').upload(path, file, { upsert: false });
  if (error) { console.error('Upload error:', error); toast('Upload failed: ' + error.message); e.target.value=''; return; }
  const { data } = sb.storage.from('comment-media').getPublicUrl(path);
  pendingAttachment = { url: data.publicUrl, type: 'image' };
  input.value = input.value + (input.value ? ' ' : '') + '[photo attached]';
  input.dispatchEvent(new Event('input'));
  showAttachPreview();
  toast('Image ready — hit Post');
  e.target.value = '';
};

/* ---------- VOICE NOTE RECORDER ---------- */
let mediaRecorder = null;
let recordedChunks = [];
let recStart = 0, recTicker = null, vizTicker = null;
const audioBtn = document.getElementById('audioBtn');
const recBar = document.getElementById('recordingBar');
const recTime = document.getElementById('recTime');
const recViz = document.getElementById('recViz');

/* Build 20 bars for the visualizer */
for (let i = 0; i < 20; i++) {
  const s = document.createElement('span');
  s.style.height = '2px';
  recViz.appendChild(s);
}
const vizBars = recViz.querySelectorAll('span');

audioBtn.onclick = async () => {
  if (!currentUser) { openModal('login'); return; }

  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    return;
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    recordedChunks = [];

    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };

    mediaRecorder.onstop = async () => {
      clearInterval(recTicker);
      clearInterval(vizTicker);
      recBar.classList.remove('active');
      audioBtn.classList.remove('recording');
      vizBars.forEach(b => b.style.height = '2px');

      const blob = new Blob(recordedChunks, { type: 'audio/webm' });
      stream.getTracks().forEach(t => t.stop());

      if (blob.size < 1000) { toast('Too short — try again'); return; }
      if (blob.size > 5 * 1024 * 1024) { toast('Voice note too large'); return; }

      const dur = Math.round((Date.now() - recStart) / 1000);

      toast('Uploading voice note…');
      const path = currentUser.id + '/voice-' + Date.now() + '.webm';
      const { error } = await sb.storage.from('comment-media').upload(path, blob, { contentType: 'audio/webm' });
      if (error) { console.error('Voice upload error:', error); toast('Upload failed: ' + error.message); return; }

      const { data } = sb.storage.from('comment-media').getPublicUrl(path);
      pendingAttachment = { url: data.publicUrl, type: 'audio', duration: dur };
      input.value = input.value + (input.value ? ' ' : '') + '[voice note attached]';
      input.dispatchEvent(new Event('input'));
      showAttachPreview();
      toast('Voice note ready — hit Post');
    };

    mediaRecorder.start();
    recStart = Date.now();
    recBar.classList.add('active');
    audioBtn.classList.add('recording');
    recTime.textContent = '0:00';

    /* Time ticker */
    recTicker = setInterval(() => {
      const s = Math.floor((Date.now() - recStart) / 1000);
      recTime.textContent = fmtDur(s);
      if (s >= 60) mediaRecorder.stop();
    }, 200);

    /* Live waveform */
    vizTicker = setInterval(() => {
      vizBars.forEach(b => {
        b.style.height = (2 + Math.random() * 20) + 'px';
      });
    }, 80);

  } catch (err) {
    console.error('Mic error:', err);
    toast('Mic permission denied');
  }
};

/* ---------- GIF ---------- */
document.getElementById('gifBtn').onclick = () => {
  if (!currentUser) { openModal('login'); return; }
  const url = window.prompt('Paste a GIF or image URL from Tenor or Giphy:');
  if (!url) return;
  if (!/^https?:\/\//i.test(url)) { toast('Invalid URL'); return; }
  pendingAttachment = { url: url, type: 'image' };
  input.value = input.value + (input.value ? ' ' : '') + '[GIF attached]';
  input.dispatchEvent(new Event('input'));
  showAttachPreview();
  toast('Ready — hit Post');
};

/* ---------- REALTIME ---------- */
let realtimeChannel = null;
function subscribeRealtime() {
  if (realtimeChannel) sb.removeChannel(realtimeChannel);
  realtimeChannel = sb.channel('comments-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'comments' }, () => { loadComments(); })
    .subscribe();
}

/* ---------- INIT ---------- */
(async () => {
  await loadSession();
  await loadComments();
  subscribeRealtime();
  sb.auth.onAuthStateChange(async (event) => {
    if (event === 'SIGNED_IN' || event === 'SIGNED_OUT') {
      await loadSession();
      await loadComments();
    }
  });
})();
</script>
